<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #121018; color: #e8e4f0;
  }
  .shell { display: flex; flex-direction: column; height: 100%; border: 1px solid #3d3555; }
  .bar {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: linear-gradient(180deg, #1e1830 0%, #171222 100%);
    border-bottom: 1px solid #3d3555; font-size: 13px;
  }
  .tag { color: #b8a8ff; font-weight: 700; letter-spacing: .08em; font-size: 11px; }
  .title { font-weight: 600; font-size: 15px; }
  .pill { margin-left: auto; padding: 3px 10px; border-radius: 999px; background: #2a2240; color: #9d8cff; font-size: 11px; }
  .body { display: flex; flex: 1; min-height: 0; }
  .side {
    width: 320px; padding: 16px; background: #15101f; border-right: 1px solid #2f2844;
    display: flex; flex-direction: column; gap: 14px; overflow: hidden;
  }
  .main { flex: 1; padding: 20px; background: #100d16; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .section { font-size: 11px; color: #8a7db8; text-transform: uppercase; letter-spacing: .06em; }
  .card {
    background: #1a1528; border: 1px solid #342c50; border-radius: 10px; padding: 12px;
  }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 8px; font-size: 13px; color: #cfc6e8; }
  .btn {
    display: inline-block; margin-top: 10px; padding: 8px 14px; border-radius: 8px;
    background: linear-gradient(135deg, #6b4cff, #8f5cff); color: #fff; font-size: 12px; font-weight: 600;
  }
  .muted { color: #7d7399; font-size: 12px; line-height: 1.5; }
  .metric { font-size: 42px; font-weight: 700; color: #c4f082; }
  .chart { height: 180px; border-radius: 10px; background: linear-gradient(180deg, #1f1930, #15101f); border: 1px solid #342c50; position: relative; overflow: hidden; }
  .chart::after {
    content: ""; position: absolute; inset: 24px 20px 30px; border-bottom: 2px solid #4ade80;
    background: linear-gradient(180deg, rgba(74,222,128,.35), transparent 70%);
    clip-path: polygon(0 80%, 15% 55%, 30% 62%, 45% 40%, 60% 48%, 75% 28%, 100% 35%, 100% 100%, 0 100%);
  }
  .tree { font-family: Consolas, monospace; font-size: 12px; line-height: 1.7; color: #b9aed6; }
  .tree .active { color: #fff; background: #2a2240; border-radius: 4px; padding: 0 4px; }
  .editor {
    flex: 1; min-height: 0; background: #0d0a12; border: 1px solid #342c50; border-radius: 10px;
    padding: 16px; font-family: Consolas, monospace; font-size: 13px; line-height: 1.6; color: #d7cff0;
    white-space: pre-wrap;
  }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .item-card { background: #1a1528; border: 1px solid #342c50; border-radius: 10px; padding: 10px; text-align: center; }
  .icon { width: 48px; height: 48px; margin: 0 auto 8px; border-radius: 8px; background: linear-gradient(135deg,#4a3a7a,#2d2248); display:flex;align-items:center;justify-content:center;font-size:22px; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { width: 42px; height: 42px; border-radius: 8px; border: 1px solid #ffffff22; }
  .nodes { flex: 1; position: relative; background: radial-gradient(circle at 30% 20%, #221a35, #100d16 60%); border: 1px solid #342c50; border-radius: 12px; }
  .node {
    position: absolute; min-width: 140px; padding: 10px 12px; border-radius: 10px;
    background: #1e1830; border: 1px solid #6b4cff; font-size: 12px; box-shadow: 0 8px 24px #0006;
  }
  .node .n-title { color: #b8a8ff; font-weight: 700; margin-bottom: 4px; }
  .preview3d {
    width: 280px; height: 220px; border-radius: 12px; border: 1px solid #342c50;
    background: linear-gradient(180deg,#1a1528,#0d0a12); display:flex;align-items:center;justify-content:center;
    font-size: 56px;
  }
</style></head><body>
    <div class="shell">
      <div class="bar"><span class="tag">STUDIO</span><span class="title">代码 / Code</span><span class="pill">CODE</span></div>
      <div class="body">
        <div class="side">
          <div class="section">src/</div>
          <div class="tree">
            <div class="active">main.ts</div>
            <div>player.ts</div>
            <div>combat/skills.ts</div>
            <div>assets/manifest.json</div>
          </div>
        </div>
        <div class="main">
          <div class="section">代码扩展页面 · cc-coder 协作</div>
          <div class="editor">// main.ts
import { createPlayer } from './player';

export function bootGame() {
  const hero = createPlayer({ hp: 120, mp: 40 });
  return hero;
}</div>
        </div></div>
    </div>
  </body></html>
