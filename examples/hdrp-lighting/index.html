              submissionKey(event.worldIdentity, event.deviceGeneration, event.frameId),
            )
          ) return;
          submittedFrames.delete(
            submissionKey(event.worldIdentity, event.deviceGeneration, event.frameId),
          );
          // A pending completion is still a terminal receipt for this
          // submitted candidate. Retire it before checking presentation so a
          // later forged/replayed ready event cannot reuse the same frame.
          if (event.presentation !== 'ready') return;
          if (phase === 'fading') return;
          hideOverlayOnSubmitted();
        };
        const destroy = () => {
          if (phase === 'entered' || phase === 'failed' || phase === 'disabled' || phase === 'destroyed') return;
          phase = 'destroyed';
          setInputEnabled(false);
          clearStartupWork();
          cleanupStartupListeners();
        };
        const recordSubmitted = (detail) => {
          if (
            detail === null ||
            typeof detail !== 'object' ||
            !Number.isSafeInteger(detail.frameId) ||
            detail.frameId < 0 ||
            !Number.isSafeInteger(detail.deviceGeneration) ||
            detail.deviceGeneration < 0
          ) return false;
          const identity =
            typeof detail.worldIdentity === 'string' && detail.worldIdentity.length > 0
              ? detail.worldIdentity
              : expectedSession ?? 'forgeax-anonymous-session';
          if (expectedSession === undefined) expectedSession = identity;
          if (typeof detail.worldIdentity === 'string' && detail.worldIdentity.length > 0 && detail.worldIdentity !== expectedSession) {
            return false;
          }
          if (
            latestSubmitted !== undefined &&
            detail.deviceGeneration !== latestSubmitted.deviceGeneration
          ) {
            submittedFrames = new Set();
          }
          latestSubmitted = {
            frameId: detail.frameId,
            deviceGeneration: detail.deviceGeneration,
            worldIdentity: detail.worldIdentity,
          };
          submittedFrames.add(
            submissionKey(detail.worldIdentity, detail.deviceGeneration, detail.frameId),
          );
          return true;
        };
        const hideOverlayOnSubmitted = () => {
          if (!gamePage) return;
          if (phase === 'entered' || phase === 'failed' || phase === 'destroyed' || phase === 'disabled') return;
          const overlay = overlayNode(loading);
          phase = 'fading';
          clearStartupWork();
          const fadeGeneration = sessionGeneration;
          setAttribute(overlay, 'aria-hidden', 'true');
          setAttribute(overlay, 'data-fading', 'true');
          setDisplay(overlay, 'none');
          // Release capture and the InputSystem gate immediately. The overlay
          // is already display:none; waiting 150ms left pointer/key dead and
          // bindSession could cancel the enable timer permanently.
          setInputEnabled(true);
          removeStartupInputCapture();
          fadeTimer = setStartupTimeout(() => {
            if (phase !== 'fading' || fadeGeneration !== sessionGeneration) return;
            phase = 'entered';
            setInputEnabled(true);
            setDisplay(overlayNode(loading), 'none');
            setAttribute(overlayNode(loading), 'aria-hidden', 'true');
            setAttribute(overlayNode(loading), 'data-fading', 'false');
            announceFrame(FRAME_READY_TYPE);
            cleanupStartupListeners();
          }, fadeDurationMs);
        };
        const beginEnteredFade = hideOverlayOnSubmitted;
        const adoptLatchedSubmitted = (detail) => {
          if (!recordSubmitted(detail)) return false;
          hideOverlayOnSubmitted();
          return true;
        };
        const onSubmitted = (event) => {
          const detail = event?.detail;
          if (detail !== null && typeof detail === 'object') latchedSubmitted = detail;
          if (!recordSubmitted(detail)) return;
          hideOverlayOnSubmitted();
        };
        const adoptExistingSubmitted = () => {
          if (latchedSubmitted !== undefined && adoptLatchedSubmitted(latchedSubmitted)) return;
          const root = typeof document === 'object' && document !== null ? document.documentElement : null;
          const frameId = Number(root?.dataset?.forgeaxFrameSubmitted);
          const deviceGeneration = Number(root?.dataset?.forgeaxFrameDeviceGeneration ?? 0);
          if (!Number.isSafeInteger(frameId) || frameId < 0) return;
          adoptLatchedSubmitted({
            frameId,
            deviceGeneration: Number.isSafeInteger(deviceGeneration) && deviceGeneration >= 0 ? deviceGeneration : 0,
            worldIdentity: expectedSession ?? 'forgeax-anonymous-session',
          });
        };
        const onCompleted = (event) => enter(event?.detail);
        const onVisibilityChange = () => {
          if (isForeground()) {
            armSlowTimer();
          } else {
            accountForegroundTime();
            clearStartupTimeout(slowTimer);
            slowTimer = undefined;
          }
        };
        const onPageHide = () => destroy();
        const onError = (event) => {
          if (event?.error !== undefined) {
            show(event.error);
            return;
          }
          const target = event?.target;
          const source =
            target !== null &&
            target !== undefined &&
            (typeof target.src === 'string' || typeof target.href === 'string')
              ? target.src ?? target.href
              : undefined;
          if (source !== undefined || event?.message !== undefined) {
            show({
              name: 'ScriptResourceError',
              message: event?.message ?? 'startup resource failed to load',
              ...(source === undefined ? {} : { detail: { source } }),
            });
            return;
          }
          show(event);
        };
        const onUnhandledRejection = (event) => show(event?.reason ?? event);
        const cleanupStartupListeners = (options = {}) => {
          if (startupListenersCleaned) return;
          startupListenersCleaned = true;
          const boundCanvas = canvas ?? resolvePrimaryCanvas();
          if (boundCanvas !== null && typeof boundCanvas.removeEventListener === 'function') {
            boundCanvas.removeEventListener('forgeax:frame-submitted', onSubmitted);
            boundCanvas.removeEventListener('forgeax:frame-completed', onCompleted);
          }
          if (typeof document.removeEventListener === 'function') {
            document.removeEventListener('forgeax:frame-submitted', onSubmitted, true);
            document.removeEventListener('forgeax:frame-completed', onCompleted, true);
          }
          if (typeof window.removeEventListener === 'function') {
            window.removeEventListener('visibilitychange', onVisibilityChange);
            window.removeEventListener('pagehide', onPageHide);
            window.removeEventListener('error', onError, { capture: true });
            window.removeEventListener('unhandledrejection', onUnhandledRejection);
          }
          removeStartupInputCapture();
          if (loadingReload !== null && typeof loadingReload.removeEventListener === 'function') {
            loadingReload.removeEventListener('click', reload);
            loadingReload.removeEventListener('keydown', onStartupControlKey);
            loadingReload.removeEventListener('keyup', onStartupControlKey);
          }
          if (
            !options.preserveFatalReload &&
            fatalReload !== null &&
            typeof fatalReload.removeEventListener === 'function'
          ) {
            fatalReload.removeEventListener('click', reload);
            fatalReload.removeEventListener('keydown', onStartupControlKey);
            fatalReload.removeEventListener('keyup', onStartupControlKey);
          }
        };
        if (
          loadingReload !== null &&
          loadingReload instanceof HTMLElement &&
          typeof loadingReload.addEventListener === 'function'
        ) loadingReload.addEventListener('click', reload);
        if (
          loadingReload !== null &&
          loadingReload instanceof HTMLElement &&
          typeof loadingReload.addEventListener === 'function'
        ) {
          loadingReload.addEventListener('keydown', onStartupControlKey);
          loadingReload.addEventListener('keyup', onStartupControlKey);
        }
        if (
          fatalReload !== null &&
          fatalReload instanceof HTMLElement &&
          typeof fatalReload.addEventListener === 'function'
        ) fatalReload.addEventListener('click', reload);
        if (
          fatalReload !== null &&
          fatalReload instanceof HTMLElement &&
          typeof fatalReload.addEventListener === 'function'
        ) {
          fatalReload.addEventListener('keydown', onStartupControlKey);
          fatalReload.addEventListener('keyup', onStartupControlKey);
        }
        const bindFrameListeners = () => {
          canvas = resolvePrimaryCanvas();
          if (canvas !== null && typeof canvas.addEventListener === 'function') {
            canvas.addEventListener('forgeax:frame-submitted', onSubmitted);
            canvas.addEventListener('forgeax:frame-completed', onCompleted);
          }
          if (typeof document.addEventListener === 'function') {
            document.addEventListener('forgeax:frame-submitted', onSubmitted, true);
            document.addEventListener('forgeax:frame-completed', onCompleted, true);
          }
          adoptExistingSubmitted();
        };
        if (gamePage) {
          bindFrameListeners();
          window.addEventListener('visibilitychange', onVisibilityChange);
          window.addEventListener('pagehide', onPageHide);
          bindStartupInputCapture();
        }
        if (fatalEnabled) {
          // Keep module/resource errors observable even when a workspace or
          // preview page intentionally starts with no loading overlay.
          window.addEventListener('error', onError, { capture: true });
          window.addEventListener('unhandledrejection', onUnhandledRejection);
        }
        if (gamePage) {
          armSlowTimer();
        } else {
          setDisplay(overlayNode(loading), 'none');
          if (typeof document.addEventListener === 'function') {
            document.addEventListener('forgeax:frame-submitted', () => announceFrame(FRAME_READY_TYPE), true);
          }
        }
        const bindSession = (session) => {
          if (typeof session !== 'string' || session.length === 0) return;
          if (phase === 'entered' || phase === 'failed' || phase === 'destroyed') return;
          if (expectedSession === session) return;
          expectedSession = session;
          sessionGeneration += 1;
          latestSubmitted = undefined;
          submittedFrames = new Set();
          if (phase === 'loading' || phase === 'preparing' || phase === 'fading') {
            accountForegroundTime();
            clearStartupWork();
            phase = 'loading';
            setInputEnabled(false);
            setDisplay(overlayNode(loading), 'grid');
            setDisplay(fatalNode(fatal), 'none');
            setAttribute(overlayNode(loading), 'aria-hidden', 'false');
            setAttribute(overlayNode(loading), 'data-fading', 'false');
            setText(loadingStatus, 'Loading…');
            armSlowTimer();
          }
        };
        globalThis.__forgeaxStartup = Object.freeze({
          prepare,
          enter,
          fail: show,
          destroy,
          bindInput,
          bindSession,
          subscribeProgress,
          progress: applyHostProgress,
        });
      })();
    
    </script>
    <script>
      (() => {
        // This inert marker keeps generated pages inspectable by older hosts
        // that only parse the fatal diagnostic hook.
        const startupFailureText = 'ForgeaX game failed to start.\n' + 'Unable to start the game.';
        void startupFailureText;
      })();
    </script>
    <script>
      (() => {
        const check = async () => {
          let ok = false;
          try {
            ok = !!(navigator.gpu && await navigator.gpu.requestAdapter());
          } catch {
            ok = false;
          }
          if (ok) return;
          const fail = globalThis.__forgeaxStartup?.fail;
          if (typeof fail === 'function') {
            fail({
              name: 'WebGPUUnavailable',
              message: 'This demo needs WebGPU',
              code: 'webgpu-unavailable',
              hint: 'Open in Chrome or Edge (latest), or Safari 26+ / Firefox with WebGPU enabled.',
            });
          }
        };
        void check();
      })();
    </script>
    <script type="module">
      (() => {
        const preferred = document.querySelector('#app');
        const marked = document.querySelector('canvas[data-forgeax-shell-canvas]');
        const listed = document.querySelectorAll('canvas');
        const canvas = preferred instanceof HTMLCanvasElement
          ? preferred
          : marked instanceof HTMLCanvasElement
            ? marked
            : listed.length === 1 && listed[0] instanceof HTMLCanvasElement
              ? listed[0]
              : listed[0] instanceof HTMLCanvasElement ? listed[0] : null;
        if (!canvas || canvas.tagName !== 'CANVAS') return;
        canvas.setAttribute('data-forgeax-shell-canvas', 'primary');
        const fit = () => {
          const ratio = window.devicePixelRatio || 1;
          const width = Math.max(1, Math.round(canvas.clientWidth * ratio));
          const height = Math.max(1, Math.round(canvas.clientHeight * ratio));
          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
          }
        };
        const resize = () => {
          fit();
          window.dispatchEvent(new Event('resize'));
        };
        fit();
        if (window.ResizeObserver) {
          try { new ResizeObserver(resize).observe(canvas); } catch { /* layout host only */ }
        }
        addEventListener('resize', fit);
        requestAnimationFrame(resize);
      })();
    </script>
  </body>
