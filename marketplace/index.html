<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>插件市场 · Marketplace — ForgeaX</title>
<meta name="description" content="ForgeaX plugins — agents, workbenches, skills, tools, CLI backends and model bindings. 每个插件的详细介绍、能力与更新历史。" />
<link rel="icon" href="/logo.svg?v=3" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css?v=forgeax-ui-130" />
<link rel="stylesheet" href="/assets/forgeax/marketplace-cards.css?v=mkt-v2-1" />
</head>
<body class="lang-en forgeax-site">
<div id="site-header"></div>
<main class="wrap">
  <div class="page-head">
    <h1><span data-lang="zh">插件市场</span><span data-lang="en">Marketplace</span></h1>
    <p><span data-lang="zh">在 ForgeaX 里,几乎一切能力都是一枚<strong>可装载插件</strong>。按类型筛选 / 搜索,点开看每个插件的详细介绍、能力与更新历史。</span><span data-lang="en">In ForgeaX nearly every capability is a <strong>loadable plugin</strong>. Filter by kind or search; open any card for its full description, capabilities and update history.</span></p>
  </div>

  <div class="mk-bar">
    <div class="mk-tabs" id="mkTabs">
      <button class="mk-tab active" data-kind="all"><span data-lang="zh">全部</span><span data-lang="en">All</span></button>
      <button class="mk-tab" data-kind="agent">Agent</button>
      <button class="mk-tab" data-kind="workbench"><span data-lang="zh">工作台</span><span data-lang="en">Workbench</span></button>
      <button class="mk-tab" data-kind="skill"><span data-lang="zh">技能</span><span data-lang="en">Skill</span></button>
      <button class="mk-tab" data-kind="backend"><span data-lang="zh">CLI 后端</span><span data-lang="en">CLI backend</span></button>
      <button class="mk-tab" data-kind="tool"><span data-lang="zh">工具</span><span data-lang="en">Tool</span></button>
      <button class="mk-tab" data-kind="binding"><span data-lang="zh">模型绑定</span><span data-lang="en">Model binding</span></button>
    </div>
    <input id="mkSearch" type="search" placeholder="Search…" data-ph-en="Search…" data-ph-zh="搜索…" aria-label="search plugins" />
  </div>
  <div class="mk-count" id="mkCount"></div>
  <div class="mk-grid" id="mkGrid"></div>
  <div class="mk-empty" id="mkEmpty" hidden><span data-lang="zh">没有匹配的插件。</span><span data-lang="en">No plugins match.</span></div>
</main>

<div id="mkModal" class="mk-modal" hidden>
  <div class="mk-modal-backdrop" data-close></div>
  <div class="mk-modal-panel" role="dialog" aria-modal="true">
    <button type="button" class="mk-modal-close" data-close aria-label="Close">✕</button>
    <div class="mk-modal-body" id="mkModalBody"></div>
  </div>
</div>

<div id="site-footer"></div>
<script src="/assets/site.js?v=forgeax-ui-130"></script>
<script>
(function () {
  var grid = document.getElementById('mkGrid'),
      countEl = document.getElementById('mkCount'),
      emptyEl = document.getElementById('mkEmpty'),
      tabs = document.getElementById('mkTabs'),
      search = document.getElementById('mkSearch'),
      modal = document.getElementById('mkModal'),
      modalBody = document.getElementById('mkModalBody');
  var DATA = {}, ORDER = [], curKind = 'all', q = '';
  var KMAP = { backend: 'cli-provider', binding: 'model-binding' };
  var KCLASS = { agent: 'k-agent', workbench: 'k-wb', skill: 'k-skill', 'cli-provider': 'k-backend', tool: 'k-tool', 'model-binding': 'k-binding' };

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function bi(o){ o = o || {}; return '<span data-lang="zh">' + esc(o.zh || o.en || '') + '</span><span data-lang="en">' + esc(o.en || o.zh || '') + '</span>'; }
  function lines(o){ o = o || {}; var z = (o.zh || o.en || '').split('\n'), e = (o.en || o.zh || '').split('\n');
    if (z.length <= 1) return '<p>' + bi(o) + '</p>';
    var n = Math.max(z.length, e.length), li = '';
    for (var i = 0; i < n; i++) li += '<li>' + bi({ zh: z[i] || '', en: e[i] || '' }) + '</li>';
    return '<ul>' + li + '</ul>'; }

  function card(p){
    var kc = KCLASS[p.kind] || 'k-tool';
    return '<button class="mk-card" data-slug="' + esc(p.slug) + '">' +
      '<div class="mk-card-top"><span class="mk-card-kind ' + kc + '">' + bi(p.kindLabel) + '</span>' +
        (p.experimental ? '<span class="mk-card-exp"><span data-lang="zh">实验性</span><span data-lang="en">experimental</span></span>' : '') + '</div>' +
      '<h3 class="mk-card-name">' + bi(p.name) + '</h3>' +
      '<p class="mk-card-sum">' + bi(p.summary) + '</p>' +
      '<div class="mk-card-meta"><span class="mono">v' + esc(p.version) + '</span>' +
        (p.caps && p.caps.tools ? '<span>' + p.caps.tools + ' tools</span>' : '') +
        (p.caps && p.caps.skills ? '<span>' + p.caps.skills + ' skills</span>' : '') +
        '<span class="mono">' + esc(p.updated || '') + '</span></div>' +
      '</button>';
  }

  function render(){
    var want = KMAP[curKind] || curKind, ql = q.trim().toLowerCase();
    var list = ORDER.map(function(s){ return DATA[s]; }).filter(function(p){
      if (curKind !== 'all' && p.kind !== want) return false;
      if (!ql) return true;
      var hay = (p.slug + ' ' + p.name.zh + ' ' + p.name.en + ' ' + p.summary.zh + ' ' + p.summary.en + ' ' + (p.keywords||[]).join(' ')).toLowerCase();
      return hay.indexOf(ql) >= 0;
    });
    grid.innerHTML = list.map(card).join('');
    emptyEl.hidden = list.length > 0;
    countEl.innerHTML = '<span class="mono">' + list.length + ' / ' + ORDER.length + '</span>';
  }

  function openModal(slug){
    var p = DATA[slug]; if (!p) return;
    var kc = KCLASS[p.kind] || 'k-tool';
    var h = '';
    h += '<div class="mk-modal-head">';
    h += '<div class="mk-chips"><span class="mk-card-kind ' + kc + '">' + bi(p.kindLabel) + '</span>' +
         (p.experimental ? '<span class="mk-card-exp"><span data-lang="zh">实验性</span><span data-lang="en">experimental</span></span>' : '') + '</div>';
    h += '<h2 class="mk-modal-name">' + bi(p.name) + '</h2>';
    h += '<div class="mk-modal-sub"><span class="mono">' + esc(p.id) + '</span><span class="mono">v' + esc(p.version) + '</span>' +
         '<span>' + bi({ zh: '作者 ' + p.author, en: 'by ' + p.author }) + '</span>' +
         (p.created ? '<span class="mono">' + bi({ zh: '创建 ' + p.created, en: 'since ' + p.created }) + '</span>' : '') + '</div>';
    h += '</div>';
    h += '<p class="mk-modal-summary">' + bi(p.summary) + '</p>';
    (p.sections || []).forEach(function(s){
      h += '<section class="mk-sec"><h4>' + bi(s.title) + '</h4>' + lines(s.body) + '</section>';
    });
    if (p.history && p.history.length){
      h += '<section class="mk-sec"><h4><span data-lang="zh">更新历史</span><span data-lang="en">Update history</span></h4><ul class="mk-hist">';
      p.history.forEach(function(ev){
        h += '<li><span class="mk-hist-date mono">' + esc(ev.date || '') + '</span>' +
             (ev.version ? '<span class="mk-hist-ver mono">v' + esc(ev.version) + '</span>' : '') +
             '<span class="mk-hist-note">' + bi(ev.notes) + '</span></li>';
      });
      h += '</ul></section>';
    }
    h += '<div class="mk-modal-links">';
    if (p.repoUrl) h += '<a class="mk-btn" href="' + esc(p.repoUrl) + '" target="_blank" rel="noopener"><span data-lang="zh">查看源码</span><span data-lang="en">View source</span></a>';
    else h += '<span class="mk-btn is-disabled"><span data-lang="zh">暂未开源</span><span data-lang="en">Not open-sourced yet</span></span>';
    h += '<a class="mk-btn primary" href="/docs/"><span data-lang="zh">文档</span><span data-lang="en">Docs</span></a>';
    h += '</div>';
    modalBody.innerHTML = h;
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeModal(){ modal.hidden = true; document.body.style.overflow = ''; }

  grid.addEventListener('click', function(e){ var b = e.target.closest('.mk-card'); if (b) openModal(b.getAttribute('data-slug')); });
  modal.addEventListener('click', function(e){ if (e.target.hasAttribute('data-close')) closeModal(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !modal.hidden) closeModal(); });
  tabs.addEventListener('click', function(e){ var t = e.target.closest('.mk-tab'); if (!t) return;
    [].forEach.call(tabs.querySelectorAll('.mk-tab'), function(x){ x.classList.remove('active'); }); t.classList.add('active');
    curKind = t.getAttribute('data-kind'); render(); });
  search.addEventListener('input', function(){ q = search.value; render(); });

  fetch('./data.json?ts=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){ DATA = (d && d.plugins) || {}; ORDER = Object.keys(DATA); render(); })
    .catch(function(e){ countEl.textContent = 'Failed to load: ' + e.message; });
})();
</script>
</body>
</html>
